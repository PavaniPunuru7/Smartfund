<!DOCTYPE html>
<html>
<head>
    <title>Matched Lenders</title>
    <style>
        .card {
            width: 300px;
            padding: 15px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center;">Matched Lenders</h2>
    <div id="lenders-container" class="container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lendersData = JSON.parse(localStorage.getItem('lendersData')) || [];
            const container = document.getElementById('lenders-container');

            lendersData.forEach(lender => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>Lender ID: ${lender.Lender_ID}</h3>
                    <p>Min Loan: $${lender.Min_Loan}</p>
                    <p>Max Loan: $${lender.Max_Loan}</p>
                    <p>Interest Rate: ${lender.Interest_Rate}%</p>
                    <p>Credit Score Required: ${lender.Credit_Score_Required}</p>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
