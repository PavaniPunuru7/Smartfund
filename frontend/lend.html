<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lend Money</title>
    <style>
        /* Basic styling for the form */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        #lend-form-section {
            padding: 40px;
            background-color: #f9f9f9;
        }
        #lend-form {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        #lend-form div {
            margin-bottom: 15px;
        }
        #lend-form label {
            display: block;
            margin-bottom: 5px;
        }
        #lend-form input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #lend-form button {
            width: 100%;
            padding: 10px;
            background: #2d3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        #lend-form button:hover {
            background: #f4b400;
        }
        #lend-form button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Lend Money Form Section -->
    <section id="lend-form-section">
        <h2 style="text-align: center; margin-bottom: 20px;">Lend Money</h2>
        <form id="lend-form">
            <div>
                <label for="lend-amount">Amount You Can Lend</label>
                <input type="number" id="lend-amount" name="lend-amount" required min="1000" oninput="updateEMI()">
            </div>
            <div>
                <label for="interest-rate">Interest Rate (%)</label>
                <input type="number" id="interest-rate" name="interest-rate" required min="0" step="0.01" oninput="updateEMI()">
            </div>
            <div>
                <label for="repayment-days">Mandatory Repayment Period (days)</label>
                <input type="number" id="repayment-days" name="repayment-days" required min="1" oninput="updateEMI()">
            </div>
            <div>
                <label for="emi">Approximate Monthly EMI</label>
                <input type="number" id="emi" name="emi" readonly>
            </div>
            <button type="submit" id="submit-button">Submit Offer</button>
            <div class="loading" id="loading-spinner">Loading...</div>
        </form>
    </section>
    <script>
        function updateEMI() {
            const amount = parseFloat(document.getElementById('lend-amount').value) || 0;
            const annualRate = parseFloat(document.getElementById('interest-rate').value) || 0;
            const repaymentDays = parseInt(document.getElementById('repayment-days').value) || 0;

            // Convert days to months (approximate)
            const months = repaymentDays / 30;

            const monthlyRate = annualRate / 12 / 100; // Monthly interest rate

            if (amount > 0 && annualRate > 0 && months > 0) {
                const emi = (amount * monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
                document.getElementById('emi').value = emi.toFixed(2);
            } else {
                document.getElementById('emi').value = 0;
            }
        }

        document.getElementById('lend-form').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission

            const lendAmount = document.getElementById('lend-amount').value;
            const interestRate = document.getElementById('interest-rate').value;
            const repaymentDays = document.getElementById('repayment-days').value;
            const emi = document.getElementById('emi').value;

            if (!lendAmount || !interestRate || !repaymentDays || !emi) {
                alert('Please fill in all fields.');
                return;
            }

            // Get JWT token from local storage (assuming user is logged in)
            const token = localStorage.getItem("user"); // Ensure this matches the key used when storing the token
            if (!token) {
                alert("Please log in first.");
                return;
            }

            // Disable the submit button and show loading spinner
            const submitButton = document.getElementById('submit-button');
            const loadingSpinner = document.getElementById('loading-spinner');
            submitButton.disabled = true;
            loadingSpinner.style.display = 'block';

            try {
                const response = await fetch("http://localhost:3000/api/lend/lendmoney", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        amount: lendAmount,
                        interest: interestRate,
                        period: repaymentDays,
                        emi: emi
                    })
                });

                const result = await response.json();
                if (response.ok) {
                    alert("Lending offer submitted successfully!");
                    // Clear the form after successful submission
                    document.getElementById('lend-form').reset();
                    document.getElementById('emi').value = 0;
                } else {
                    alert(result.message || "Error submitting offer.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong. Please try again.");
            } finally {
                // Re-enable the submit button and hide loading spinner
                submitButton.disabled = false;
                loadingSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
