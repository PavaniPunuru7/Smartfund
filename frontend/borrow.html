<!DOCTYPE html>
<html>
    <head>
    </head>
    <body>
        <!-- Loan Application Form Section -->
        <section id="loan-application" style="padding: 40px; background-color: #f9f9f9;">
            <h2 style="text-align: center; margin-bottom: 20px;">Apply for a Loan</h2>
            <form id="loan-form" style="max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);">
                
                <!-- Loan Amount Input -->
                <div style="margin-bottom: 15px;">
                    <label for="loan-amount" style="display: block; margin-bottom: 5px;">Loan Amount</label>
                    <input type="number" id="loan-amount" name="loan-amount" required min="1000" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>

                <!-- Interest Rate Input -->
                <div style="margin-bottom: 15px;">
                    <label for="interest-rate" style="display: block; margin-bottom: 5px;">Preferred Interest Rate (%)</label>
                    <input type="number" id="interest-rate" name="interest-rate" required min="1" step="0.1" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>

                <!-- Credit Score Input -->
                <div style="margin-bottom: 15px;">
                    <label for="credit-score" style="display: block; margin-bottom: 5px;">Credit Score</label>
                    <input type="number" id="credit-score" name="credit-score" required min="300" max="850" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                
                <button type="submit" style="width: 100%; padding: 10px; background: #2d3e50; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s;">Submit Application</button>
            </form>
        </section>
    </body>

    <script>
        document.getElementById('loan-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent form from submitting

            // Fetch input values
            const loanAmount = document.getElementById('loan-amount').value;
            const interestRate = document.getElementById('interest-rate').value;
            const creditScore = document.getElementById('credit-score').value;

            // Validate inputs
            if (!loanAmount || loanAmount < 1000) {
                alert("Invalid Loan Amount! It must be at least 1000.");
                return;
            }

            if (!interestRate || interestRate < 1) {
                alert("Invalid Interest Rate! It must be at least 1%.");
                return;
            }

            if (!creditScore || creditScore < 300 || creditScore > 850) {
                alert("Invalid Credit Score! It must be between 300 and 850.");
                return;
            }

            // If all inputs are valid
            if (loanAmount && interestRate && creditScore) {
                alert('Loan application submitted successfully!');
                // Here, you can add code to send the form data to your backend
                const formData = {
                    loanAmount: loanAmount,
                    interestRate: interestRate,
                    creditScore: creditScore
                };

                console.log('Form Data:', formData);
                // Example: Send to backend using fetch API
                fetch('http://localhost:5000/api/match-lenders', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json',
    },
    body: JSON.stringify(formData),
})
.then(response => {
    if (!response.ok) {
        return response.json().then(err => { throw new Error(err.error); });
    }
    return response.text();
})
.then(data => {
    localStorage.setItem('lendersData', data);
    window.location.href = 'lenders.html';
})
.catch(error => {
    alert(error.message); // Show fraud message if flagged
});

        }});
    </script>
</html>
